<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>המספרה של שמשון – קביעת תור</title>
  <meta name="description" content="קביעת תור אונליין למספרה של שמשון. בחר יום ושעה, מלא שם וטלפון – וזהו.">
  <meta name="theme-color" content="#0f1720">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="המספרה של שמשון">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('davidTheme');if(t&&t!=='1')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <div class="wrap">

    <div class="topbar">
      <div class="logo">💈</div>
      <div>
        <h1 id="bizName">המספרה של שמשון</h1>
        <p id="subTitle">קביעת תור אונליין · כל תור 10 דקות</p>
      </div>
    </div>

    <!-- שלב 1: בחירת יום -->
    <div class="card">
      <h2>1. בחר יום <span class="sub">(ראשון–חמישי)</span></h2>
      <div class="days" id="days"><div class="spinner">טוען ימים…</div></div>
    </div>

    <!-- שלב 2: בחירת שעה -->
    <div class="card" id="slotsCard">
      <h2>2. בחר שעה</h2>
      <div id="slots" class="empty-note">בחר קודם יום למעלה ☝️</div>
    </div>

    <!-- שלב 3: פרטים -->
    <div class="card" id="formCard">
      <h2>3. הפרטים שלך</h2>
      <p class="pick-summary" id="pickSummary">עדיין לא נבחר תור.</p>

      <label for="name">שם מלא</label>
      <input type="text" id="name" placeholder="לדוגמה: משה כהן" autocomplete="name">

      <label for="phone">טלפון</label>
      <input type="tel" id="phone" placeholder="050-0000000" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:right">

      <div class="msg" id="msg"></div>

      <button class="btn" id="bookBtn" disabled>קבע תור</button>
    </div>

    <div class="foot">
      אין לך אינטרנט? אפשר לקבוע גם בטלפון: <b id="phoneLine">0772249224</b><br>
      <a href="admin.html">כניסת ניהול</a>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
